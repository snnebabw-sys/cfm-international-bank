<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="description" content="CFM International — Digital Banking">
  <title>CFM International</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth -->
  <section id="authView" class="screen">
    <div class="auth-card">
      <div class="logo-mark">CFM</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your CFM account</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@email.com">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <button class="btn primary full" type="submit">Sign in</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <!-- Customer Dashboard -->
  <section id="customerView" class="screen hidden">
    <div class="phone-frame">
      <div class="status-bar"></div>

      <!-- Header -->
      <header class="app-header">
        <div class="avatar-sm" id="customerAvatar">C</div>
        <div class="tabs">
          <button class="tab active">Accounts</button>
          <button class="tab">Cards</button>
        </div>
        <button class="icon-btn" id="signOutBtn" title="Sign out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </header>

      <main class="app-content">
        <!-- Account Card -->
        <div class="account-card">
          <div class="card-top">
            <span class="card-label" id="accountCurrencyLabel">USD Account</span>
            <span class="flag">🇬🇧</span>
          </div>
          <div class="card-balance" id="balance">€0.00</div>
          <div class="account-number-row">
            <span class="account-number" id="accountNumberValue">—</span>
            <button class="copy-btn" id="copyAccount">Copy</button>
          </div>
          <div class="card-actions">
            <button class="action-btn" id="transferBtn">
              <span class="plus">+</span> Transfer
            </button>
            <button class="action-btn" id="depositBtn">
              <span class="plus">+</span> Deposit
            </button>
            <button class="action-btn" id="tradeBtn">
              <span class="plus">+</span> Trade
            </button>
            <button class="action-btn" id="cryptoBtn">
              <span class="plus">+</span> Crypto
            </button>
          </div>
        </div>

        <!-- Transactions -->
        <section class="section">
          <div class="section-header">
            <h2>Transactions</h2>
            <button class="link" id="seeAllTx">See all</button>
          </div>
          <div id="transactionList" class="tx-list"></div>
        </section>

        <!-- Net Worth -->
        <section class="section net-worth">
          <h2>Net Worth</h2>
          <div class="net-value" id="netWorth">€0.00</div>
          <p class="muted">Current value</p>
          <div class="cash-row">
            <div class="cash-left">
              <div class="cash-icon">💰</div>
              <div>
                <div class="cash-label">Cash balance</div>
                <div class="cash-sub">3 accounts</div>
              </div>
            </div>
            <div class="cash-right">
              <div class="cash-amount" id="cashBalance">€0.00</div>
              <div class="cash-pct">97%</div>
            </div>
          </div>
        </section>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="overview">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-tab="transactions">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Transactions</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <!-- Transfer Sheet -->
    <div id="transferSheet" class="sheet hidden">
      <div class="sheet-handle"></div>
      <h2>Send money</h2>
      <form id="transferForm">
        <label>Receiver full name</label>
        <input id="receiverName" required maxlength="100">
        <label>Account number</label>
        <input id="receiverAccount" required maxlength="24">
        <label>Country</label>
        <select id="receiverCountry" required>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Nigeria">Nigeria</option>
          <option value="United States">United States</option>
          <option value="Canada">Canada</option>
          <option value="France">France</option>
          <option value="Germany">Germany</option>
          <option value="Spain">Spain</option>
          <option value="Other">Other</option>
        </select>
        <label>Amount</label>
        <input id="amount" type="number" min="0.01" step="0.01" required>
        <label>Description (optional)</label>
        <input id="description" maxlength="120">
        <button class="btn primary full" type="submit">Send</button>
      </form>
      <p id="transferMessage" class="message"></p>
      <button class="btn ghost full" id="closeTransfer">Cancel</button>
    </div>
  </section>

  <!-- Admin -->
  <section id="adminView" class="screen hidden">
    <div class="admin-wrap">
      <header class="admin-header">
        <h1>Admin</h1>
        <button id="adminSignOut" class="btn ghost">Sign out</button>
      </header>
      <div class="admin-grid">
        <div class="card">
          <h2>Create account</h2>
          <form id="createForm">
            <label>Full name</label>
            <input id="newName" required>
            <label>Email</label>
            <input id="newEmail" type="email" required>
            <label>Phone</label>
            <input id="newPhone" type="tel">
            <label>Country</label>
            <input id="newCountry" value="United Kingdom" required>
            <label>Currency</label>
            <select id="newCurrency">
              <option value="GBP">GBP</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="NGN">NGN</option>
            </select>
            <label>Password (min 12)</label>
            <input id="newPassword" type="password" minlength="12" required>
            <label>Initial balance</label>
            <input id="initialBalance" type="number" min="0" step="0.01" value="0">
            <button class="btn primary full" type="submit">Create</button>
          </form>
          <p id="createMessage" class="message"></p>
        </div>
        <div class="card">
          <h2>Credit account</h2>
          <form id="creditForm">
            <label>Account number</label>
            <input id="creditAccount" required>
            <label>Amount</label>
            <input id="creditAmount" type="number" min="0.01" step="0.01" required>
            <label>Reason</label>
            <input id="creditReason" required>
            <button class="btn primary full" type="submit">Credit</button>
          </form>
          <p id="creditMessage" class="message"></p>
          <hr>
          <h2>Accounts</h2>
          <button id="refreshAccounts" class="btn outline">Refresh</button>
          <div id="accountList"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Receipt -->
  <section id="receiptView" class="sheet hidden">
    <div class="sheet-handle"></div>
    <h2>Transfer receipt</h2>
    <div id="receiptDetails"></div>
    <button id="printReceipt" class="btn primary full">Print</button>
    <button id="closeReceipt" class="btn ghost full">Close</button>
  </section>

  <script src="index.js" defer></script>
</body>
</html>
